name: Python worker checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: gateway_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U gateway -d gateway_test" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      WORKER_DATABASE_URL: postgresql://gateway:ci-only@127.0.0.1:5432/gateway_test
      WORKER_TEST_DSN: postgresql://gateway:ci-only@127.0.0.1:5432/gateway_test
      WORKER_DB_SCHEMA: worker_runtime_test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --requirement requirements-test.txt
      - run: python scripts/verify_gitignore.py
      - name: Python dependency vulnerability scan
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --requirement requirements.txt
      - name: Validate repeatable PostgreSQL migration
        run: |
          python -m worker_runtime migrate
          python -m worker_runtime migrate
          python -c "from worker_runtime.repository import connect; import os; c=connect(os.environ['WORKER_DATABASE_URL'], application_name='migration-check'); v=c.execute('SELECT max(version) AS version FROM worker_schema').fetchone()['version']; assert v == 6, v; print(f'migration version {v} verified'); c.close()"
      - run: python -m compileall -q worker_runtime
      - run: python -m unittest discover -s worker_runtime/tests -v
      - name: Build and scan worker image
        run: |
          docker build -f Dockerfile.worker -t chronos-worker:ci .
          mkdir -p "$HOME/.cache"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache:/root/.cache" aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 chronos-worker:ci
