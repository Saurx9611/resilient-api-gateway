name: Python worker checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: gateway_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U gateway -d gateway_test" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      WORKER_DATABASE_URL: postgresql://gateway:ci-only@127.0.0.1:5432/gateway_test
      WORKER_TEST_DSN: postgresql://gateway:ci-only@127.0.0.1:5432/gateway_test
      WORKER_DB_SCHEMA: worker_runtime_test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --requirement requirements-test.txt
      - run: python -m compileall -q worker_runtime
      - run: python -m unittest discover -s worker_runtime/tests -v
