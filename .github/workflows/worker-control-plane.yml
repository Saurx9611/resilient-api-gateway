name: Worker control plane

on:
  push:
  pull_request:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-worker-password
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run worker and control-plane tests against PostgreSQL
        env:
          WORKER_DATABASE_URL: postgresql://gateway:ci-worker-password@127.0.0.1:5432/gateway_test
          WORKER_TEST_DSN: postgresql://gateway:ci-worker-password@127.0.0.1:5432/gateway_test
          WORKER_DB_SCHEMA: worker_runtime_test
        run: python -m unittest discover -s worker_runtime/tests -v
